    <text x="319" y="423" text-anchor="middle" font-size="16" font-weight="700" fill="#DDE9E4">Mock Data</text>
    <rect x="420" y="396" width="170" height="42" rx="21" fill="#1D313B" stroke="#36504F"/>
    <text x="505" y="423" text-anchor="middle" font-size="16" font-weight="700" fill="#DDE9E4">Sanitized</text>
  </g>
