      <text x="42" y="49" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">03</text>
      <text x="82" y="42" font-family="Segoe UI, PingFang TC, sans-serif" font-size="22" font-weight="750" fill="#FFFFFF">Smart Search</text>
      <text x="82" y="70" font-family="Segoe UI, PingFang TC, sans-serif" font-size="14" fill="#B9C9C3">Route and stop ranking</text>
      <text x="82" y="92" font-family="Segoe UI, PingFang TC, sans-serif" font-size="14" fill="#B9C9C3">dynamic keypad state</text>
