      <text x="82" y="42" font-family="Segoe UI, PingFang TC, sans-serif" font-size="22" font-weight="750" fill="#FFFFFF">Bus ETA</text>
      <text x="82" y="70" font-family="Segoe UI, PingFang TC, sans-serif" font-size="14" fill="#B9C9C3">Arrival estimation</text>
      <text x="82" y="92" font-family="Segoe UI, PingFang TC, sans-serif" font-size="14" fill="#B9C9C3">state and matching</text>
    </g>
