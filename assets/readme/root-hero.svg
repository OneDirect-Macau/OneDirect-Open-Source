      <rect x="18" y="18" width="48" height="48" rx="12" fill="#2E8B57"/>
      <text x="42" y="49" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">04</text>
