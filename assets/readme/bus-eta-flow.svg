<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-label="Bus ETA flow">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#E4572E"/>
    </marker>
  </defs>
  <rect width="1400" height="360" rx="24" fill="#FFFFFF" stroke="#ECD9D2"/>
  <text x="52" y="70" font-family="Segoe UI, PingFang TC, sans-serif" font-size="16" font-weight="800" fill="#E4572E">ETA PIPELINE</text>
  <g font-family="Segoe UI, PingFang TC, sans-serif" font-size="18" font-weight="700" fill="#17231F">
    <rect x="52" y="120" width="246" height="130" rx="16" fill="#FFF1EB"/>
    <text x="74" y="162">LiveRouteSnapshot</text>
    <text x="74" y="194" font-size="14" font-weight="500" fill="#775E55">stop order + vehicles</text>
    <rect x="392" y="120" width="246" height="130" rx="16" fill="#FFF1EB"/>
    <text x="414" y="162">Direction Match</text>
    <text x="414" y="194" font-size="14" font-weight="500" fill="#775E55">coverage + ordering</text>
    <rect x="732" y="120" width="246" height="130" rx="16" fill="#FFF1EB"/>
    <text x="754" y="162">Arrival Estimator</text>
    <text x="754" y="194" font-size="14" font-weight="500" fill="#775E55">distance + speed</text>
    <rect x="1072" y="120" width="276" height="130" rx="16" fill="#17231F"/>
    <text x="1094" y="162" fill="#FFFFFF">Typed ETA Output</text>
    <text x="1094" y="194" font-size="14" font-weight="500" fill="#B9C9C3">minutes + state + arrivals</text>
  </g>
  <path d="M298 185 L392 185" stroke="#E4572E" stroke-width="4" marker-end="url(#a)"/>
  <path d="M638 185 L732 185" stroke="#E4572E" stroke-width="4" marker-end="url(#a)"/>
  <path d="M978 185 L1072 185" stroke="#E4572E" stroke-width="4" marker-end="url(#a)"/>
</svg>
